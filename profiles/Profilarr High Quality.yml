# Profilarr High Quality
# Assumptions for file size estimates:
# - 90-minute movie
# - Average bitrates used to estimate relative file sizes:
#   1080p Bluray/WEB-DL/WEBRip: ~8–12 GB
#   2160p Bluray/WEB-DL/WEBRip: ~25–50 GB
#   Remux 2160p: ~40–60 GB (large, high priority in High Quality)
#   720p Bluray/WEB-DL/WEBRip: ~3–5 GB
# - Lower resolutions scaled accordingly; tiered to maintain fallback
name: Profilarr High Quality
description: "Profilarr High Quality prioritizes 1080p first, then 2160p/remux above 720p. Includes all qualities to avoid missing files, maintaining proper quality progression."
tags:
- 1080p
- High Quality
- Lossy Audio
- x264
- h264
upgradesAllowed: true
minCustomFormatScore: 20000
upgradeUntilScore: 600000
minScoreIncrement: 1
custom_formats:
# 1080p
- name: 1080p WEB-DL
  score: 380000 # ~8–12 GB
- name: 1080p Bluray
  score: 280000 # ~8–12 GB
- name: 1080p WEBRip
  score: 280000 # ~8–12 GB
# 2160p and Remux (above 720p)
