- name: 2160p WEBRip
  score: 240000 # ~25–50 GB
- name: 2160p HDTV
  score: 235000 # ~25–50 GB
- name: 2160p Remux
  score: 230000 # ~40–60 GB
- name: BR-DISK-2160p
  score: 228000 # ~40–60 GB
